name: Deploy Pages

# Publishes the VitePress site (docs/) to GitHub Pages via the artifact method —
# no gh-pages branch.
#
# A published release or a manual dispatch rebuilds it, and nothing else does —
# the trigger pair every sibling repository uses. Use "Run workflow" for an
# immediate refresh, e.g. a docs fix that should not wait for the next release.
#
# No submodules and no secrets: TypeDoc reads `src/`, which is TypeScript, and
# VitePress renders markdown. Neither needs the Brain or the SDK.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and let an in-progress one finish rather than
# cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A Release deploys the site only when it becomes Latest
  # (scripts/release-channel.sh, read from the default branch): a pre-release
  # once its package has a full release, or a patch to an earlier line, leaves
  # the site as it is. A dispatch always deploys.
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.channel.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-tags: true
          persist-credentials: false
      - id: channel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          channel="$(./scripts/release-channel.sh "$TAG")"
          echo "::notice::${TAG} is a ${channel} release"
          if [ "$channel" = latest ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: channel
    if: needs.channel.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Before setup-node, whose pnpm cache needs the binary. The version is
        # package.json's packageManager.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      # Its own step, rather than left to build-pages.sh below (which is why that
      # is invoked with prepare=no), so a dependency failure is legible as one in
      # the run summary.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the Pages tree
        # scripts/build-pages.sh — the same script a contributor runs locally, so
        # CI and a local build cannot drift. It is `typedoc && vitepress build`:
        # TypeDoc fails the build on an error, and VitePress fails on a dead link,
        # so a page that points at a heading somebody renamed does not reach the
        # site. Both locales come out of the one build; VitePress resolves docs/ja
        # itself.
        #
        # Every option is spelled out rather than left to the script's defaults:
        # they are chosen for a working tree, and a publish should not change
        # because one of them did.
        run: ./scripts/build-pages.sh prepare=no api=yes serve=no

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege: only this job gets the Pages write and OIDC tokens.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
