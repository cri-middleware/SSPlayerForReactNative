name: CI

# Everything here runs with **no secrets and no submodules**, which is the whole
# reason it can exist today: SpriteStudio-SDK is private, so a job that needed it
# would fail for every external contributor and every fork.
#
# What that leaves out, so nobody mistakes a green tick for more than it is:
#
#   * the host checks (`check-framedata`, `check-mask`, `check-shader`,
#     `check-hidden`) — they build a host Brain out of the SDK submodule, and
#     `check-mask` / `check-shader` also link the macOS-only libskia RN Skia
#     ships. They want a macOS job with SDK access.
#   * `cpp/format/` being current — regenerating needs a `flatc` whose version
#     matches the vendored headers, which `static_assert` on it. An
#     apt-installed flatc would report a diff that means "wrong flatc", not
#     "stale output". `pnpm run check-framedata` is where that check lives.
#   * anything that needs the Brain — `prepack`, and therefore `npm pack`.
#
# Add a macOS job with `secrets.SDK_SUBMODULE_TOKEN` when there is one; the
# sibling players already carry that pattern.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🐧 Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No submodules on purpose. `third_party/flatbuffers` is only needed to
        # *compile* the C++, which happens in the consumer's build, and the SDK
        # is private. Nothing below opens either.

      - name: Setup pnpm
        # Before setup-node, whose pnpm cache needs the binary. The version is
        # package.json's packageManager.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # Passes with no submodules, no `native/` and no SDK access — the
        # property this whole workflow is built on.
        run: pnpm run typecheck

      - name: Unit tests
        # `core/`, `player/` and `view/`. Nitro, Skia and Reanimated are aliased
        # to stubs and the Brain is faked at the package's own module boundary,
        # so none of it needs a device — what is left to the host checks and the
        # example's Player screen is the drawing, which a fake cannot judge.
        run: pnpm test

      - name: The Nitro bindings are current
        # `nitrogen/` is generated output that is committed and never hand-edited,
        # so the thing worth checking is that it still matches the spec. A PR that
        # edits `SsRuntime.nitro.ts` and forgets to regenerate produces bindings
        # that disagree with it, and nothing else would notice.
        run: |
          pnpm run generate-nitro-code
          git diff --exit-code -- packages/react-native-spritestudio/nitrogen \
            || { echo "::error::nitrogen/ is stale — run 'pnpm run generate-nitro-code' and commit the result"; exit 1; }

      - name: The package builds
        # What `prepack` runs before publishing, minus the parts that need the
        # Brain. A TypeScript error that only `bob` sees would otherwise surface
        # at release time.
        run: pnpm --filter react-native-spritestudio run build

      - name: The web stub barrel still imports clean
        # The one check here that runs the code rather than reading it: it
        # transpiles `src/`, walks `index.web.ts`'s import closure and then
        # imports it. All three ways it breaks pass `typecheck` and surface in
        # somebody else's web build — a re-export that reaches Skia or Nitro
        # (both throw at module scope on web), an export missing from the web
        # barrel, a stub that stopped throwing. Needs no Brain and no SDK: being
        # import-clean is the whole property.
        run: pnpm run check-web-barrel

      - name: Both halves of every toolchain script parse
        # Each package.json script is a `.js` shim over a `.sh` + `.ps1` pair so Windows
        # contributors are not shut out — which only holds if the `.ps1` half is
        # also kept working, and it is the half nobody runs by accident.
        run: |
          for f in scripts/*.sh tools/*.sh; do bash -n "$f"; done
          pwsh -NoProfile -Command '
            $bad = 0
            Get-ChildItem scripts/*.ps1 | ForEach-Object {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
              if ($errors) { Write-Host "::error file=$($_.Name)::$($errors[0].Message)"; $bad = 1 }
            }
            exit $bad'

      - name: The published tarball would not carry build output
        # `files` takes a directory *recursively*, which is how `"android"` once
        # pulled 2.8 GB of `.cxx` into `npm pack`. `prepack` guards the rest, but
        # it needs the Brain and so cannot run here.
        run: |
          node -e '
            const { files } = require("./packages/react-native-spritestudio/package.json")
            if (files.includes("android")) {
              console.error("::error::files lists \"android\" whole — list CMakeLists.txt, build.gradle and src instead")
              process.exit(1)
            }
          '
