version: 2
updates:
  # The npm tree. One entry at the root and no more: this is a single-lockfile
  # workspace, so a per-directory entry would have Dependabot fighting itself
  # over `package-lock.json`.
  #
  # The peer dependencies are pinned in the root `overrides` onto whatever
  # `expo install` chose, so a bump here that moves one of them is a bump that
  # has to be read rather than merged — two copies of a native module is two
  # autolinked pods fighting over one JSI registration.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    # The five the root `overrides` pin are not the registry's to move. Their
    # version comes from the Expo compatibility table `example/` installs
    # against, so a registry bump raises a declared range that the overrides
    # then contradict -- and npm stops resolving the workspace at all rather
    # than installing something old. #65 did exactly that (peer
    # `react-native@^0.87.1` against an override pinning 0.86.2) and `npm ci`
    # has been red ever since. Move them by hand, together, when the example's
    # Expo SDK moves.
    ignore:
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: '@shopify/react-native-skia'
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

# No `gitsubmodule` entry, deliberately. SpriteStudio-SDK is private, so
# Dependabot cannot read it; and `third_party/flatbuffers` must move only with
# the flatc that generated `cpp/format/*.h`, which those headers static_assert
# on — an automatic bump there breaks the build in a way the PR cannot explain.
